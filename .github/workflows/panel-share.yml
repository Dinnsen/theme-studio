name: Share panel build

# Builds the panel on feature branches and pushes the result to
# panel-build/<branch>, so it can be reviewed and committed from a machine
# without npm access. main is never touched.

on:
  push:
    branches-ignore:
      - main
      - "panel-build/**"
    paths:
      - "frontend/**"
      - ".github/workflows/panel-share.yml"

permissions:
  contents: write

jobs:
  share:
    name: Share panel build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Push build to panel-build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f custom_components/theme_studio/frontend/theme-studio-panel.js frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Build already committed."
            exit 0
          fi
          git commit -q -m "Panel build for ${GITHUB_SHA}"
          git push -f origin "HEAD:refs/heads/panel-build/${GITHUB_REF_NAME}"
