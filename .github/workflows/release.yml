name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release made by hand already
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag matches the manifest version
        if: steps.existing.outputs.exists != 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/theme_studio/manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match manifest version $version."
            exit 1
          fi

      - name: Release notes from the changelog
        if: steps.existing.outputs.exists != 'true'
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[0-9]|\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          PY

      - name: Publish the GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Theme Studio ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
