initialize_assets:
  fields:
    overwrite:
      required: false
      default: true
      selector:
        boolean:
    backup:
      required: false
      default: true
      selector:
        boolean:

reinstall_assets:
  fields:
    backup:
      required: false
      default: true
      selector:
        boolean:

generate:

save_preset:
  fields:
    payload:
      required: true
      selector:
        object:

copy_preset:
  fields:
    source:
      required: true
      example: Dark Blue
      selector:
        text:
    name:
      required: true
      example: My Theme
      selector:
        text:

delete_user_theme:
  fields:
    name:
      required: true
      example: My Theme
      selector:
        text:

build_theme:
  fields:
    name:
      required: true
      example: My Theme
      selector:
        text:

refresh_catalogs:

copy_variant:
  fields:
    source:
      required: true
      example: dark
      selector:
        select:
          options:
            - light
            - dark

undo:

export_user_theme:
  fields:
    name:
      required: true
      example: My Theme
      selector:
        text:

import_user_theme:
  fields:
    data:
      required: false
      example: "TS1:eNp..."
      selector:
        text:
          multiline: true
    name:
      required: false
      example: Shared theme
      selector:
        text:

palette_from_image:
  fields:
    image:
      required: false
      example: orange-fade.jpg
      selector:
        text:
    apply:
      required: false
      default: false
      selector:
        boolean:

set_options:
  target:
    entity:
      integration: theme_studio
      domain: select
  fields:
    options:
      required: true
      example: '["None", "My Theme"]'
      selector:
        object:
