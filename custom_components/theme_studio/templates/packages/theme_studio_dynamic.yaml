  - service: text.set_value
    target:
      entity_id: text.theme_studio_busy_message
    data:
      value: Refreshing themes
  - service: theme_studio.refresh_catalogs
  - delay: 00:00:01
  - service: homeassistant.update_entity
    target:
      entity_id:
      - sensor.theme_studio_user_theme_catalog
      - sensor.theme_studio_active_preset
  - delay: 00:00:01
  - service: script.turn_on
    target:
      entity_id: script.theme_studio_sync_preset_options
  - service: script.turn_on
    target:
      entity_id: script.theme_studio_sync_user_theme_options
  - delay: 00:00:01

  - service: select.select_option
    target:
      entity_id: select.theme_studio_theme_presets
    data:
      option: None
  - service: select.select_option
    target:
      entity_id: select.theme_studio_user_themes
    data:
      option: '{{ desired_name }}'
  - service: text.set_value
    target:
      entity_id: text.theme_studio_selected_user_theme
    data:
      value: '{{ desired_name }}'
  - delay: 00:00:01

  - service: homeassistant.update_entity
    target:
      entity_id: sensor.theme_studio_active_preset
  - delay: 00:00:01

  - choose:
    - conditions:
      - condition: template
        value_template: '{{ original_variant | trim == ''Light'' }}'
      sequence:
      - service: text.set_value
        target:
          entity_id: text.theme_studio_busy_message
        data:
          value: 'Loading copied Light: {{ desired_name }}'
      - service: button.press
        target:
          entity_id: button.theme_studio_theme_load_light_theme
      - delay: 00:00:02
      - service: text.set_value
        target:
          entity_id: text.theme_studio_loaded_variant
        data:
          value: Light
    default:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_busy_message
      data:
        value: 'Loading copied Dark: {{ desired_name }}'
    - service: button.press
      target:
        entity_id: button.theme_studio_theme_load_dark_theme
    - delay: 00:00:02
    - service: text.set_value
      target:
        entity_id: text.theme_studio_loaded_variant
      data:
        value: Dark

  - service: text.set_value
    target:
      entity_id: text.theme_studio_pending_new_theme_name
    data:
      value: ''
  - service: text.set_value
    target:
      entity_id: text.theme_studio_busy_message
    data:
      value: Idle
  - service: switch.turn_off
    target:
      entity_id: switch.theme_studio_busy
  mode: restart

