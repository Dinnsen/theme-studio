        {% if preset not in ['', 'None', 'unknown', 'unavailable'] %}{{ preset }}{% elif user not in ['', 'None', 'unknown', 'unavailable'] %}{{ user }}{% else %}{{ states('text.theme_studio_selected_user_theme') }}{% endif %}
