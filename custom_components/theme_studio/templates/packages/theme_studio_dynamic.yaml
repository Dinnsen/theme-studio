      source_name: >-
        {% set preset = states('select.theme_studio_theme_presets') | trim %}
        {% set user_theme = states('select.theme_studio_user_themes') | trim %}
        {% set selected_user_theme = states('text.theme_studio_selected_user_theme') | trim %}
        {% if preset not in ['', 'None', 'unknown', 'unavailable'] %}
          {{ preset }}
        {% elif user_theme not in ['', 'None', 'unknown', 'unavailable'] %}
          {{ user_theme }}
        {% elif selected_user_theme not in ['', 'None', 'unknown', 'unavailable'] %}
          {{ selected_user_theme }}
        {% else %}
          Default
