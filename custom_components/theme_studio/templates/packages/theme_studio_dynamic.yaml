template:
- sensor:
  - name: theme_studio theme summary
    state: '{{ states(''text.theme_studio_theme_base_color'') }} - overlay {{ states(''select.theme_studio_theme_background_overlay'') }} - o{{ states(''number.theme_studio_theme_overlay_contrast'') }} - bg{{ states(''number.theme_studio_theme_background_contrast'') }}'
    attributes:
      background: '{{ states(''text.theme_studio_theme_custom_background_color'') if is_state(''switch.theme_studio_theme_use_custom_background_color'',''on'') else ''auto'' }}'
      image: '{{ states(''select.theme_studio_theme_background_image_select'') if is_state(''switch.theme_studio_theme_use_background_image'',''on'') else ''none'' }}'
      text_override: '{{ states(''text.theme_studio_theme_custom_text_color'') if is_state(''switch.theme_studio_theme_use_custom_text_color'',''on'') else ''off'' }}'
      icon_override: '{{ states(''text.theme_studio_theme_custom_icon_color'') if is_state(''switch.theme_studio_theme_use_custom_icon_color'',''on'') else ''off'' }}'
      nav_override: '{{ states(''text.theme_studio_theme_custom_navbar_icon_color'') if is_state(''switch.theme_studio_theme_use_custom_navbar_icon_color'',''on'') else ''off'' }}'
      accent_override: '{{ states(''text.theme_studio_theme_accent_color_override'') }}'
      card_override: '{{ states(''text.theme_studio_theme_card_bg_override'') }}'
      bubble_override: '{{ states(''text.theme_studio_theme_bubble_bg_override'') }}'
      popup_override: '{{ states(''text.theme_studio_theme_popup_bg_override'') }}'
  - name: theme_studio picker hex
    state: '{% set r = states(''number.theme_studio_picker_red'') | int(0) %} {% set g = states(''number.theme_studio_picker_green'') | int(0) %} {% set b = states(''number.theme_studio_picker_blue'') | int(0) %} {{ ''#%02X%02X%02X'' | format(r, g, b) }}'
script:
  theme_studio_export_selected_user_theme:
    alias: Theme Studio - export selected user theme
    mode: single
    sequence:
    - if:
      - condition: template
        value_template: "{{ states('select.theme_studio_user_themes') not in ['None', '', 'unknown', 'unavailable'] }}"
      then:
      - service: theme_studio.export_user_theme
        data:
          name: "{{ states('select.theme_studio_user_themes') }}"
      else:
      - service: persistent_notification.create
        data:
          notification_id: theme_studio_share
          title: Theme Studio export
          message: Select a user theme first. Built-in presets are already part of Theme Studio.
  theme_studio_picker_apply_base_color:
    alias: theme_studio picker - apply base color
    sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.theme_studio_theme_use_custom_background_color
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_base_color
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_custom_bg_color:
    alias: theme_studio Picker Apply Custom BG Color
    sequence:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_custom_background_color
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
    - service: switch.turn_on
      target:
        entity_id: switch.theme_studio_theme_use_custom_background_color
  theme_studio_picker_apply_accent_override:
    alias: theme_studio picker - apply accent override
    sequence:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_accent_color_override
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_card_bg_override:
    alias: theme_studio picker - apply card bg override
    sequence:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_card_bg_override
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_bubble_bg_override:
    alias: theme_studio picker - apply bubble bg override
    sequence:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_bubble_bg_override
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_popup_bg_override:
    alias: theme_studio picker - apply popup bg override
    sequence:
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_popup_bg_override
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_navbar_icon_override:
    alias: theme_studio picker - apply navbar icon override
    sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.theme_studio_theme_use_custom_navbar_icon_color
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_custom_navbar_icon_color
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_icon_override:
    alias: theme_studio picker - apply icon override
    sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.theme_studio_theme_use_custom_icon_color
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_custom_icon_color
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_apply_text_override:
    alias: theme_studio picker - apply text override
    sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.theme_studio_theme_use_custom_text_color
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_custom_text_color
      data:
        value: '{{ states(''sensor.theme_studio_picker_hex'') }}'
  theme_studio_picker_set_rgb_from_hex:
    alias: theme_studio Picker Set RGB From Hex
    mode: restart
    fields:
      hex_color:
        description: Hex color
        example: '#344334'
    sequence:
    - variables:
        raw: '{{ (hex_color | default(''#344334'', true) | string).strip() }}'
        cleaned: '{{ raw | replace(''#'', '''') | lower }}'
        valid: '{{ cleaned | length == 6 }}'
        r_hex: '{{ cleaned[0:2] if valid else ''34'' }}'
        g_hex: '{{ cleaned[2:4] if valid else ''43'' }}'
        b_hex: '{{ cleaned[4:6] if valid else ''34'' }}'
        r_val: '{{ r_hex | int(0, 16) }}'
        g_val: '{{ g_hex | int(0, 16) }}'
        b_val: '{{ b_hex | int(0, 16) }}'
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_red
      data:
        value: '{{ r_val }}'
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_green
      data:
        value: '{{ g_val }}'
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_blue
      data:
        value: '{{ b_val }}'
  theme_studio_picker_set_rgb:
    alias: theme_studio Picker Set RGB
    mode: restart
    fields:
      r:
        description: Red
        example: 52
      g:
        description: Green
        example: 67
      b:
        description: Blue
        example: 52
    sequence:
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_red
      data:
        value: '{{ r | int(0) }}'
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_green
      data:
        value: '{{ g | int(0) }}'
    - service: number.set_value
      target:
        entity_id: number.theme_studio_picker_blue
      data:
        value: '{{ b | int(0) }}'
  theme_studio_theme_set_font_sans_serif:
    alias: theme_studio theme - set font sans serif
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: sans-serif
  theme_studio_theme_set_font_system_ui:
    alias: theme_studio theme - set font system ui
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: system-ui
  theme_studio_theme_set_font_roboto:
    alias: theme_studio theme - set font roboto
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Roboto
  theme_studio_theme_set_font_inter:
    alias: theme_studio theme - set font inter
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Inter
  theme_studio_theme_set_font_quicksand:
    alias: theme_studio theme - set font quicksand
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Quicksand
  theme_studio_theme_set_font_iosevka:
    alias: theme_studio theme - set font iosevka
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Iosevka Charon Mono
  theme_studio_theme_set_font_josefin:
    alias: theme_studio theme - set font josefin
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Josefin Sans
  theme_studio_theme_set_font_orbitron:
    alias: theme_studio theme - set font orbitron
    mode: restart
    sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.theme_studio_theme_use_custom_font
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_primary_font_family
      data:
        value: Orbitron
  theme_studio_theme_reset_defaults:
    alias: theme_studio theme - reset defaults
    mode: restart
    sequence:
    - variables:
        current_preset: '{% set v = states(''select.theme_studio_theme_presets'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}None{% else %}{{ v | string | trim }}{% endif %}'
        current_user: '{% set v = states(''select.theme_studio_user_themes'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}None{% else %}{{ v | string | trim }}{% endif %}'
        current_variant: '{% set v = states(''text.theme_studio_loaded_variant'') %} {% if v in [''Light'', ''Dark''] %}{{ v }}{% else %}Dark{% endif %}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_user != ''None'' }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_presets
          data:
            option: Default
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: None
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: None
      - conditions:
        - condition: template
          value_template: '{{ current_preset not in [''None'', ''unknown'', ''unavailable'', ''''] }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: None
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: None
      default:
      - service: select.select_option
        target:
          entity_id: select.theme_studio_theme_presets
        data:
          option: Default
      - service: select.select_option
        target:
          entity_id: select.theme_studio_user_themes
        data:
          option: None
      - service: text.set_value
        target:
          entity_id: text.theme_studio_selected_user_theme
        data:
          value: None
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.theme_studio_active_preset
    - delay: 00:00:01
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_variant | trim == ''Light'' }}'
        sequence:
        - service: text.set_value
          target:
            entity_id: text.theme_studio_loaded_variant
          data:
            value: Light
        - service: button.press
          target:
            entity_id: button.theme_studio_theme_load_light_theme
      default:
      - service: text.set_value
        target:
          entity_id: text.theme_studio_loaded_variant
        data:
          value: Dark
      - service: button.press
        target:
          entity_id: button.theme_studio_theme_load_dark_theme
  theme_studio_sync_background_image_options:
    alias: Theme Studio - sync background image options
    sequence:
    - variables:
        raw: '{{ state_attr(''sensor.theme_studio_background_image_catalog'',''options'') | default([], true) | list }}'
        default_value: CloudWhite.png
        current_value: "{% set v = states('select.theme_studio_theme_background_image_select') %} {% if v in ['unknown', 'unavailable', '', none] %}\n  {{ default_value }}\n{% else %}\n  {{ v | string | trim }}\n{% endif %}"
        bg_opts: "{% set ns = namespace(items=[]) %} {% for item in raw %}\n  {% set name = (item | string | trim) %}\n  {% if name not in ['', 'unknown', 'unavailable'] and name not in ns.items %}\n    {% set ns.items = ns.items + [name] %}\n  {% endif %}\n{% endfor %} {{ ([default_value] + ns.items) | unique | list }}"
    - service: theme_studio.set_options
      target:
        entity_id: select.theme_studio_theme_background_image_select
      data:
        options: '{{ bg_opts }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_value in bg_opts }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_background_image_select
          data:
            option: '{{ current_value }}'
      default:
      - service: select.select_option
        target:
          entity_id: select.theme_studio_theme_background_image_select
        data:
          option: '{{ default_value }}'
    - service: text.set_value
      target:
        entity_id: text.theme_studio_theme_background_image_url
      data:
        value: /local/background/{{ states('select.theme_studio_theme_background_image_select') }}
  theme_studio_sync_preset_options:
    alias: Theme Studio - sync preset options
    sequence:
    - variables:
        preset_opts:
        - None
        - Default
        - Glass
        - MD3
        - Dark Blue
        - Flavors
        - Vision
        - Dark Green
        - Purple
        - Pink Mono
        - Black White
        - Aurora
        current_preset: '{% set v = states(''select.theme_studio_theme_presets'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}Default{% else %}{{ v | string | trim }}{% endif %}'
        current_user_theme: '{% set v = states(''select.theme_studio_user_themes'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}None{% else %}{{ v | string | trim }}{% endif %}'
    - service: theme_studio.set_options
      target:
        entity_id: select.theme_studio_theme_presets
      data:
        options: '{{ preset_opts }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_user_theme != ''None'' }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_presets
          data:
            option: None
      - conditions:
        - condition: template
          value_template: '{{ current_preset in preset_opts and current_preset != ''None'' }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_presets
          data:
            option: '{{ current_preset }}'
      default:
      - service: select.select_option
        target:
          entity_id: select.theme_studio_theme_presets
        data:
          option: Default
  theme_studio_sync_user_theme_options:
    alias: Theme Studio - sync user theme options
    sequence:
    - variables:
        raw: '{{ state_attr(''sensor.theme_studio_user_theme_catalog'',''options'') | default([], true) | list }}'
        raw_names: "{% set ns = namespace(items=[]) %} {% for item in raw %}\n  {% set name = (item | string).strip() %}\n  {% if name not in ['', 'None', 'unknown', 'unavailable'] and name not in ns.items %}\n    {% set ns.items = ns.items + [name] %}\n  {% endif %}\n{% endfor %} {{ ns.items }}"
        current_user: '{% set v = states(''select.theme_studio_user_themes'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}None{% else %}{{ v | string | trim }}{% endif %}'
        selected_user: '{% set v = states(''text.theme_studio_selected_user_theme'') %} {% if v in [''unknown'', ''unavailable'', '''', none] %}None{% else %}{{ v | string | trim }}{% endif %}'
        user_opts: '{{ [''None''] + raw_names }}'
    - service: theme_studio.set_options
      target:
        entity_id: select.theme_studio_user_themes
      data:
        options: '{{ user_opts }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_user != ''None'' and current_user in raw_names }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: '{{ current_user }}'
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: '{{ current_user }}'
      - conditions:
        - condition: template
          value_template: '{{ selected_user != ''None'' and selected_user in raw_names }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: '{{ selected_user }}'
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: '{{ selected_user }}'
      default:
      - service: select.select_option
        target:
          entity_id: select.theme_studio_user_themes
        data:
          option: None
      - service: text.set_value
        target:
          entity_id: text.theme_studio_selected_user_theme
        data:
          value: None
  theme_studio_select_current_name:
    alias: Theme Studio - select current name
    sequence:
    - variables:
        builtins:
        - Default
        - Glass
        - MD3
        - Dark Blue
        - Flavors
        - Vision
        - Dark Green
        - Purple
        - Pink Mono
        - Black White
        - Aurora
        current_name: '{{ states(''text.theme_studio_theme_name'') }}'
        user_options: '{{ state_attr(''sensor.theme_studio_user_theme_catalog'',''options'') | default([], true) }}'
    - condition: template
      value_template: '{{ current_name not in [''unknown'',''unavailable'',''''] }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_name in builtins }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_presets
          data:
            option: '{{ current_name }}'
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: None
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: None
      - conditions:
        - condition: template
          value_template: '{{ current_name in user_options }}'
        sequence:
        - service: select.select_option
          target:
            entity_id: select.theme_studio_theme_presets
          data:
            option: None
        - service: select.select_option
          target:
            entity_id: select.theme_studio_user_themes
          data:
            option: '{{ current_name }}'
        - service: text.set_value
          target:
            entity_id: text.theme_studio_selected_user_theme
          data:
            value: '{{ current_name }}'
  theme_studio_toggle_loaded_variant:
    alias: Theme Studio Toggle Loaded Variant
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: text.theme_studio_loaded_variant
          state: Light
        sequence:
        - service: button.press
          target:
            entity_id: button.theme_studio_theme_load_dark_theme
      default:
      - service: button.press
        target:
          entity_id: button.theme_studio_theme_load_light_theme
automation:
- id: theme_studio_dynamic_theme_generate_and_apply
  alias: Theme Studio Dynamic - generate and apply
  trigger:
  - platform: state
    entity_id:
    - text.theme_studio_theme_base_color
    - text.theme_studio_theme_custom_background_color
    - select.theme_studio_theme_background_image_select
    - text.theme_studio_theme_custom_text_color
    - text.theme_studio_theme_custom_icon_color
    - text.theme_studio_theme_custom_navbar_icon_color
    - text.theme_studio_theme_navbar_bg_override
    - text.theme_studio_theme_bubble_slider_color_override
    - number.theme_studio_theme_bubble_slider_contrast
    - number.theme_studio_theme_bubble_slider_hue_shift
    - number.theme_studio_theme_bubble_slider_saturation
    - number.theme_studio_theme_bubble_slider_opacity
    - text.theme_studio_theme_accent_color_override
    - text.theme_studio_theme_card_bg_override
    - text.theme_studio_theme_bubble_bg_override
    - text.theme_studio_theme_popup_bg_override
    - text.theme_studio_theme_secondary_background_color_override
    - text.theme_studio_theme_secondary_text_color_override
    - text.theme_studio_theme_disabled_text_color_override
    - text.theme_studio_theme_app_header_background_color_override
    - text.theme_studio_theme_app_header_text_color_override
    - text.theme_studio_theme_divider_color_override
    - text.theme_studio_theme_sidebar_icon_color_override
    - text.theme_studio_theme_state_icon_color_override
    - text.theme_studio_theme_state_icon_active_color_override
    - text.theme_studio_theme_primary_font_family
    - text.theme_studio_theme_custom_font_family
    - text.theme_studio_theme_custom_font_path
    - text.theme_studio_theme_name
    - number.theme_studio_theme_contrast
    - number.theme_studio_theme_hue_shift
    - number.theme_studio_theme_saturation
    - number.theme_studio_theme_tone
    - number.theme_studio_theme_accent_strength
    - number.theme_studio_theme_neutrality
    - number.theme_studio_theme_card_opacity
    - number.theme_studio_theme_blur_strength
    - number.theme_studio_theme_radius
    - number.theme_studio_theme_chip_radius
    - number.theme_studio_theme_overlay_contrast
    - number.theme_studio_theme_background_contrast
    - number.theme_studio_theme_header_blend_height
    - number.theme_studio_theme_overlay_offset_y
    - number.theme_studio_theme_overlay_scale
    - number.theme_studio_theme_overlay_spread
    - number.theme_studio_theme_accent_contrast
