- id: theme_studio_load_dark
  alias: Theme Studio - load dark theme
  trigger:
  - platform: state
    entity_id: button.theme_studio_theme_load_dark_theme
  condition:
  - condition: template
    value_template: "{{ trigger.platform != 'state' or (trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != 'unavailable' and trigger.to_state.state not in ['unavailable', 'unknown']) }}"
  action:
  - service: switch.turn_on
    target:
      entity_id: switch.theme_studio_busy
  - service: text.set_value
    target:
      entity_id: text.theme_studio_busy_message
    data:
      value: Loading Dark
  - service: text.set_value
    target:
      entity_id: text.theme_studio_loaded_variant
    data:
      value: Dark
  - service: homeassistant.update_entity
    target:
      entity_id: sensor.theme_studio_active_preset
  - delay: 00:00:01
  - variables:
      dark_data: '{{ state_attr(''sensor.theme_studio_active_preset'',''dark'') or {} }}'
      dark_bg_image: '{{ (state_attr(''sensor.theme_studio_active_preset'',''dark'') or {}).get(''background_image_url'') if (state_attr(''sensor.theme_studio_active_preset'',''dark'') or {}).get(''background_image_url'') is not none else states(''select.theme_studio_theme_background_image_select'') }}'
