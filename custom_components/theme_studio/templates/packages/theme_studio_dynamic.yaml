- id: theme_studio_new_theme
  alias: Theme Studio - new theme
  trigger:
  - platform: state
    entity_id: button.theme_studio_new_theme
  condition:
  - condition: template
    value_template: "{{ trigger.platform != 'state' or (trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != 'unavailable' and trigger.to_state.state not in ['unavailable', 'unknown']) }}"
  action:
  - variables:
      desired_name: >-
        {% set v = states('text.theme_studio_theme_name') | trim %}
        {% if v in ['', 'unknown', 'unavailable', none] %}
          My Theme
        {% else %}
